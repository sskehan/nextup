<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Next Up</title>
<meta name="theme-color" content="#16131a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a video-store poster wall; condensed episode codes (S02E09) are the app's voice */
:root{
  --bg:#16131a;--surface:#211d26;--raise:#2c2732;--fg:#f3eee8;--muted:#a99f98;--line:#3a3440;
  --accent:#ff8a1f;--accent-ink:#1d0e00;--good:#5cc98e;--bad:#e8665a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f1ec;--surface:#ffffff;--raise:#ece5dc;--fg:#1e1a20;--muted:#6e655f;--line:#ddd4ca;
  --accent:#d96400;--accent-ink:#ffffff;--good:#1f8a52;--bad:#c23b2e;color-scheme:light}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:4px;padding-block:10px 2px}
.brandwrap{flex:1;min-width:0;display:grid;gap:3px}
.brand{font:700 27px/1 var(--display);letter-spacing:.01em;display:flex;align-items:center;gap:9px;margin:0}
.syncline{justify-self:start;border:0;background:none;padding:2px 0 2px 19px;font:500 12px/1.2 var(--body);color:var(--muted);cursor:pointer;text-align:left;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncline.ok{color:var(--good)} .syncline.warn{color:var(--accent)}
.menuver{padding:10px 12px 6px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.menu .mh{padding:10px 12px 4px;font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.menu button[aria-checked=true]{color:var(--accent);font-weight:600}
.menu button[aria-checked=true]::after{content:"✓";float:right}
.panel h3{font:700 21px/1.1 var(--display);margin:0}
.panel p{margin:0}
.panel.alert{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.snap{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.snap .t{flex:1;min-width:0}
.snap small{color:var(--muted);display:block}
.help h3{font:700 21px/1.1 var(--display);margin:24px 0 6px}
.help p,.help li{max-width:65ch;color:var(--fg)}
.help ul{padding-left:20px;margin:6px 0;display:grid;gap:6px}
.help .note{margin-top:6px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.iconbtn{width:42px;height:42px;border:0;background:transparent;color:var(--fg);border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:active{background:var(--raise)}
.iconbtn svg{width:22px;height:22px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex}
.tab{flex:1;border:0;background:none;color:var(--muted);font:600 13px/1 var(--body);letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;padding:13px 0 11px;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected=true]{color:var(--fg);border-color:var(--accent)}
.tab small{color:var(--accent);margin-left:4px;letter-spacing:0;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font:500 13px/1 var(--body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{padding-block:8px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px;margin-top:10px}
.card{display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:6px;overflow:hidden;background:var(--raise)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font:700 18px/1.05 var(--display);color:var(--muted)}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}
.bar span{display:block;height:100%;background:var(--accent)}
.badge{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);font:700 13px/1 var(--display);padding:4px 6px;border-radius:4px;letter-spacing:.03em}
.badge.seen{background:var(--good);color:#06180d}
.quick{position:absolute;right:6px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(15,12,18,.8);color:#fff;display:grid;place-items:center;cursor:pointer}
.quick svg{width:18px;height:18px}
.cap{font-size:13px;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.cap b{font:700 15px/1 var(--display);color:var(--accent);letter-spacing:.03em;margin-right:3px}
.cap strong{color:var(--fg);font-weight:600}
.section-h{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:26px 0 4px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:60px;height:60px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer;z-index:25}
.fab svg{width:28px;height:28px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 18px;margin-top:18px;display:grid;gap:12px}
.empty h2{font:700 25px/1.1 var(--display);margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.btn{border:0;border-radius:10px;padding:12px 16px;font:600 15px/1 var(--body);cursor:pointer;background:var(--raise);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--bad)}
.btn.small{padding:9px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px}
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.pagebar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.pagebar h2{font:700 22px/1.1 var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;gap:16px;padding-block:18px 6px}
.hero .poster{width:118px;flex:none}
.hero .meta{min-width:0;display:grid;gap:7px;align-content:start}
.hero h1{font:700 30px/1 var(--display);margin:0;text-wrap:balance}
.hero .sub{color:var(--muted);font-size:14px}
.pill{display:inline-block;font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);width:max-content}
.pill.live{border-color:var(--good);color:var(--good)}
.summary{color:var(--muted);margin:10px 0 4px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin-block:16px}
.panel>label,.lbl{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.prog{display:flex;gap:8px}
.prog select{flex:1;min-width:0}
select,input[type=search],input[type=text],textarea{width:100%;font:16px/1.3 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:230px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5}
details.season{border-top:1px solid var(--line)}
details.season summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 0;cursor:pointer}
details.season summary::-webkit-details-marker{display:none}
.season .sn{font:700 21px/1 var(--display);flex:1}
.season .sc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.season .sc.full{color:var(--good)}
.mini{border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:7px 10px;font:500 12px/1 var(--body);cursor:pointer}
.ep{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.ep .code{font:700 15px/1 var(--display);color:var(--accent);width:60px;flex:none;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.ep .t{flex:1;min-width:0}
.ep .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .t small{color:var(--muted);font-size:12px}
.ep.future{opacity:.55}
.ep.seen .code{color:var(--muted)}
.chk{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;display:grid;place-items:center;cursor:pointer}
.chk svg{width:18px;height:18px}
.chk[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#06180d}
.chk:disabled{cursor:default}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:8px;font:600 14px/1 var(--body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--fg)}
.results{display:grid;margin-top:8px}
.res{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res img,.res .noimg{width:48px;height:72px;object-fit:cover;border-radius:4px;background:var(--raise);flex:none}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-weight:600}
.res .t small{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.up-day{font:700 19px/1 var(--display);margin:22px 0 6px}
.up{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.up img,.up .noimg{width:40px;height:60px;object-fit:cover;border-radius:4px;flex:none;background:var(--raise)}
.up .t{min-width:0;flex:1}
.up .t b{font-weight:600}
.up .t small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .code{font:700 15px/1 var(--display);color:var(--accent);letter-spacing:.03em}
.menu{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 54px);right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:6px;min-width:240px}
.menu button,.menu label{display:block;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:13px 12px;font:500 15px/1 var(--body);border-radius:8px;cursor:pointer}
.menu button:active,.menu label:active{background:var(--raise)}
.scrim{position:fixed;inset:0;z-index:45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;font-weight:500;z-index:60;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
.toast button{border:0;background:none;color:var(--accent);font:700 14px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;padding:6px}
.log{font-size:14px;display:grid;gap:5px}
.log .ok{color:var(--good)} .log .bad{color:var(--bad)}
.note{color:var(--muted);font-size:13px;margin:0}
.note code{font-size:12px;background:var(--raise);padding:1px 5px;border-radius:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.banner{position:relative;height:220px;overflow:hidden;background:var(--raise)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
.banner img.blur{filter:blur(18px) saturate(1.2);transform:scale(1.2)}
.banner .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.75) 100%)}
.bback{position:absolute;top:8px;left:max(6px,env(safe-area-inset-left,0px));color:#fff}
.banner h1{position:absolute;left:0;right:0;bottom:14px;margin:0;color:#fff;font:700 32px/1.02 var(--display);text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.banner h1 span{font-weight:600;opacity:.85}
.ptabs{position:sticky;top:0;z-index:3;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.ptabs button{flex:1;border:0;background:none;color:var(--muted);font:600 14px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:16px 0 13px;border-bottom:3px solid transparent;cursor:pointer}
.ptabs button[aria-selected=true]{color:var(--fg);border-color:var(--accent)}
.ptabs small{color:var(--accent);letter-spacing:0;margin-left:4px}
.ov{display:grid;gap:4px}
.nextup{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-block:16px 8px}
.nextup .t{flex:1;min-width:0;display:grid;gap:4px}
.nextup .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nextup b{font:700 17px/1 var(--display);color:var(--accent);letter-spacing:.03em}
.nextup small{color:var(--muted);font-size:12px}
.nextup .btn svg{width:18px;height:18px}
.orow{display:flex;gap:18px;padding-block:12px;align-items:flex-start}
.oi{width:24px;height:24px;flex:none;color:var(--accent);margin-top:1px}
.oi svg{width:24px;height:24px}
.stars{display:flex;align-items:center;gap:2px;font-size:20px;color:var(--line);margin-bottom:8px}
.stars .on{color:var(--accent)}
.stars .half{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars small{font-size:13px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.sum{margin:0;max-width:65ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.sum.open{display:block}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.pbar .track{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar .track span{display:block;height:100%;background:var(--accent)}
.pbar b{font-variant-numeric:tabular-nums;font-weight:600}
.cast{display:grid;gap:4px}
.person{display:flex;align-items:center;gap:16px;padding:6px 0}
.person img,.person .noimg{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--raise)}
.person .t{min-width:0}
.person small{color:var(--muted)}
.ep .code{width:auto;display:inline}
.ep .t div{font-size:15px}
.ep .t small{font-size:13px}
.eye{width:44px;height:44px;flex:none;border:0;background:none;color:var(--line);display:grid;place-items:center;cursor:pointer;border-radius:50%;-webkit-touch-callout:none;user-select:none}
.eye svg{width:26px;height:26px;pointer-events:none}
.eye[aria-pressed=true]{color:var(--accent)}
.eye:disabled{opacity:.4;cursor:default}
.eye:active{background:var(--raise)}
.syn{margin:8px 0 2px;color:var(--muted);font-size:14px;line-height:1.45;max-width:65ch;white-space:normal}
.syn.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;margin-top:6px}
.syn.clamp.open{display:block}
.nextup .t .syn{white-space:normal}
.ep .t[data-act=ep-syn]{cursor:pointer}
.ep .t[aria-expanded=true] div{white-space:normal}
.sglist{display:grid;margin-top:8px}
.sg{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.poster.sm{width:72px;flex:none}
.poster.sm .ph{font-size:13px}
.sg .t{flex:1;min-width:0;display:grid;gap:6px;align-content:start}
.sg .t b{font-size:16px;font-weight:600}
.sg .t small{color:var(--muted);font-size:13px}
.sg .t small strong{color:var(--fg);font-weight:600}
.sgnote{margin:0;font-style:italic}
.sgsum{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.sgsum.open{display:block}
.sg .row{margin-top:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card .poster{transition:transform .15s}.card:active .poster{transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
</style>
</head>
<body>
<header>
  <div class="top pad">
    <div class="brandwrap"><h1 class="brand"><i></i>Next Up</h1><button id="syncLine" class="syncline" data-act="open-backup"></button></div>
    <button class="iconbtn" id="sortBtn" data-act="sort" aria-label="Sort"></button>
    <button class="iconbtn" id="refreshBtn" data-act="refresh-all" aria-label="Refresh episode lists"></button>
    <button class="iconbtn" data-act="menu" aria-label="More options"></button>
  </div>
  <nav class="tabs pad" role="tablist">
    <button class="tab" role="tab" data-act="tab" data-tab="shows">Shows</button>
    <button class="tab" role="tab" data-act="tab" data-tab="upcoming">Upcoming</button>
    <button class="tab" role="tab" data-act="tab" data-tab="movies">Movies</button>
    <button class="tab" role="tab" data-act="tab" data-tab="suggested">Suggested</button>
  </nav>
</header>
<main id="main" class="pad"></main>
<button class="fab" data-act="add" aria-label="Add a show or movie"></button>
<div id="page" class="page" hidden></div>
<div id="scrim" class="scrim" hidden data-act="close-menu"></div>
<div id="menu" class="menu" hidden>
  <button data-act="refresh-all">Refresh all shows</button>
  <button data-act="bulk">Add several shows at once</button>
  <button data-act="open-backup">Backup &amp; restore</button>
  <button data-act="help">Help</button>
  <button data-act="about">About</button>
  <div class="menuver" id="menuVer"></div>
</div>
<div id="sortMenu" class="menu" hidden></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
const KEY='nextup.v1', API='https://api.tvmaze.com', DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>String(h||'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const pad=n=>String(n).padStart(2,'0');
const code=e=>`S${pad(e.s)}E${pad(e.e)}`;
const fmtDay=t=>new Date(t).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const fmtDate=t=>new Date(t).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

/* ---------- storage: IndexedDB on the phone (falls back to localStorage) ----------
   'data' = shows & movies (what gets backed up)   'meta' = sync state and Dropbox sign-in (never backed up) */
const APP_VERSION='1.02';
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('nextup',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=r.onblocked=()=>res(null)}catch(e){res(null)}})}
function kvGet(k){return new Promise(res=>{
  if(!idb){try{res(JSON.parse(localStorage.getItem('nextup.kv.'+k)))}catch(e){res(null)}return}
  try{const r=idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result??null);r.onerror=()=>res(null)}catch(e){res(null)}})}
function kvPut(k,v){return new Promise(res=>{
  if(!idb){try{localStorage.setItem('nextup.kv.'+k,JSON.stringify(v))}catch(e){toast('Could not save. Phone storage may be full.')}res();return}
  try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();
    t.onerror=t.onabort=()=>{toast('Could not save. Phone storage may be full.');res()}}catch(e){res()}})}
const emptyData=()=>({shows:{},movies:[],suggestions:[],lastRefresh:0});
const hasData=()=>Object.keys(S.shows).length>0||S.movies.length>0||(S.suggestions||[]).length>0;
let S=emptyData(),M={};
function saveMeta(){M.stamp=Date.now();return kvPut('meta',M)}
function save(){
  M.dirty=true;M.changes=(M.changes||0)+1;M.seq=(M.seq||0)+1;
  kvPut('data',S);saveMeta();paintStatus();scheduleSync();
}
async function loadAll(){
  idb=await idbOpen();
  let d=await kvGet('data');
  if(!d){try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.shows){d=old;await kvPut('data',d)}}catch(e){}} // move v1.0 data across
  S=(d&&d.shows&&Array.isArray(d.movies))?d:emptyData();if(!Array.isArray(S.suggestions))S.suggestions=[];
  M=await kvGet('meta')||{};
  if(!M.deviceId){M.deviceId=Math.random().toString(36).slice(2,10);M.created=Date.now();
    M.dirty=hasData();M.changes=M.dirty?1:0;M.seq=0;M.wifiOnly=false;await saveMeta()}
  if(navigator.storage&&navigator.storage.persist){try{if(!(await navigator.storage.persisted()))await navigator.storage.persist()}catch(e){}}
}

try{V.tab=localStorage.getItem('nextup.tab')||'shows';V.sort=localStorage.getItem('nextup.sort')||'az';V.msort=localStorage.getItem('nextup.msort')||'az'}catch(e){}

/* ---------- data sources ---------- */
async function getJSON(url,tries=2){
  const r=await fetch(url);
  if(r.status===429&&tries>0){await sleep(2500);return getJSON(url,tries-1)}
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='np'+Date.now()+Math.floor(Math.random()*1e6);
    const s=document.createElement('script');
    const done=()=>{delete window[cb];s.remove();clearTimeout(t)};
    const t=setTimeout(()=>{done();rej(new Error('timeout'))},12000);
    window[cb]=d=>{done();res(d)};
    s.onerror=()=>{done();rej(new Error('failed'))};
    s.src=url+'&callback='+cb;
    document.head.appendChild(s);
  });
}
function fromApi(j,prev){
  const eps=((j._embedded&&j._embedded.episodes)||[])
    .filter(e=>e.season!=null&&e.number!=null)
    .map(e=>({id:e.id,s:e.season,e:e.number,n:e.name||'TBA',a:e.airstamp||(e.airdate?e.airdate+'T12:00:00Z':''),r:e.runtime||0,sm:strip(e.summary)}))
    .sort((x,y)=>x.s-y.s||x.e-y.e);
  const cast=((j._embedded&&j._embedded.cast)||[]).slice(0,12).map(c=>({p:c.person&&c.person.name||'',c:c.character&&c.character.name||'',img:(c.character&&c.character.image&&c.character.image.medium)||(c.person&&c.person.image&&c.person.image.medium)||''}));
  return {
    id:j.id,name:j.name,image:j.image?(j.image.medium||j.image.original):'',
    status:j.status||'',network:(j.network&&j.network.name)||(j.webChannel&&j.webChannel.name)||'',
    premiered:j.premiered||'',genres:j.genres||[],summary:strip(j.summary),url:j.url||'',
    runtime:j.runtime||j.averageRuntime||0,rating:(j.rating&&j.rating.average)||0,
    cast:cast.length?cast:(prev&&prev.cast)||[],bg:prev?prev.bg||'':'',bgTried:prev?!!prev.bgTried:false,
    episodes:eps,watched:prev?prev.watched:[],added:prev?prev.added:Date.now(),
    lastWatched:prev?prev.lastWatched||0:0,from:prev?prev.from||'':'',updated:Date.now()
  };
}
async function fetchShow(id){return getJSON(`${API}/shows/${id}?embed[]=episodes&embed[]=cast`)}
async function fetchBanner(sh){
  if(sh.bgTried||!navigator.onLine)return;
  try{const imgs=await getJSON(`${API}/shows/${sh.id}/images`)||[];
    const bg=imgs.find(x=>x.type==='background'&&x.main)||imgs.find(x=>x.type==='background')||imgs.find(x=>x.type==='banner');
    sh.bg=bg?((bg.resolutions.medium&&bg.resolutions.medium.url)||bg.resolutions.original.url):'';sh.bgTried=true;save();
    if(V.page&&V.page.type==='show'&&V.page.id===sh.id)renderPage();
  }catch(e){}
}

/* ---------- show logic ---------- */
const aired=e=>!!e.a&&Date.parse(e.a)<=Date.now();
function info(sh){
  const w=new Set(sh.watched);let a=0,seen=0,next=null,upcoming=null;
  for(const e of sh.episodes){
    if(aired(e)){a++;if(w.has(e.id))seen++;else if(!next)next=e}
    else if(!upcoming&&e.a)upcoming=e;
  }
  const state=next?'towatch':(sh.status==='Ended'&&!upcoming?'finished':'caughtup');
  return {aired:a,seen,unseen:a-seen,next,upcoming,state};
}
function setProgress(sh,spec){
  spec=String(spec||'').trim().toUpperCase();
  let m;
  if(!spec||spec==='NONE'){sh.watched=[];return true}
  if(spec==='ALL'){sh.watched=sh.episodes.filter(aired).map(e=>e.id)}
  else if((m=spec.match(/^S(\d+)E(\d+)$/))){const s=+m[1],n=+m[2];sh.watched=sh.episodes.filter(e=>e.s<s||(e.s===s&&e.e<=n)).map(e=>e.id)}
  else if((m=spec.match(/^S(\d+)$/))){const s=+m[1];sh.watched=sh.episodes.filter(e=>e.s<=s).map(e=>e.id)}
  else return false;
  if(sh.watched.length)sh.lastWatched=Date.now();
  return true;
}

function renderShows(shows){

const sortName=s=>String(s||'').replace(/^the\s+/i,'').toLowerCase();
function showSorter(k,rank){
  const far=Number.MAX_SAFE_INTEGER,az=(x,y)=>sortName(x.sh.name).localeCompare(sortName(y.sh.name));
  const up=x=>x.i.upcoming?Date.parse(x.i.upcoming.a):far;
  return {az,
    towatch:(x,y)=>rank[x.i.state]-rank[y.i.state]||az(x,y),
    recent:(x,y)=>(y.sh.lastWatched||0)-(x.sh.lastWatched||0)||az(x,y),
    airdate:(x,y)=>up(x)-up(y)||az(x,y)}[k]||az;
}
const SHOW_SORTS=[['az','A–Z'],['towatch','To watch first'],['recent','Recently watched'],['airdate','Next air date']];
const MOVIE_SORTS=[['az','A–Z'],['added','Recently added'],['year','Year (newest first)']];

function showCard({sh,i}){
  const pct=i.aired?Math.round(i.seen/i.aired*100):0;
  let cap;
  if(i.next)cap=`<b>${code(i.next)}</b>${esc(i.next.n)}`;
  else if(i.upcoming)cap=`All caught up<br><strong>New ep ${fmtDay(i.upcoming.a)}</strong>`;
  else cap=i.state==='finished'?'Finished':'All caught up';
  return `<div class="card" data-act="open-show" data-id="${sh.id}" role="button" tabindex="0" aria-label="${esc(sh.name)}">
    <div class="poster">${posterImg(sh.image,sh.name)}

      <div class="bar"><span style="width:${pct}%"></span></div></div>

function renderUpcoming(shows){
  const now=Date.now();const recent=[],soon=[];
  for(const sh of shows){const w=new Set(sh.watched);
    for(const e of sh.episodes){if(!e.a)continue;const t=Date.parse(e.a);
      if(t<=now&&t>now-7*DAY&&!w.has(e.id))recent.push({sh,e,t});
      else if(t>now&&t<now+60*DAY)soon.push({sh,e,t});}}
  recent.sort((a,b)=>b.t-a.t);soon.sort((a,b)=>a.t-b.t);
  const item=({sh,e,t})=>`<div class="up" data-act="open-show" data-id="${sh.id}" role="button" tabindex="0">
    ${sh.image?`<img src="${esc(sh.image)}" alt="" loading="lazy">`:'<div class="noimg"></div>'}
    <div class="t"><b>${esc(sh.name)}</b><small><span class="code">${code(e)}</span> ${esc(e.n)}</small></div>
    <small class="note">${new Date(t).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})}</small></div>`;
  let h='';
  if(recent.length)h+=`<h3 class="section-h">Aired this week, not watched</h3>${recent.map(item).join('')}`;
  if(soon.length){h+=`<h3 class="section-h">Coming up</h3>`;let last='';
    for(const x of soon){const d=fmtDay(x.t);if(d!==last){h+=`<div class="up-day">${d}</div>`;last=d}h+=item(x)}}
  if(!h)h=`<div class="empty"><h2>Nothing scheduled in the next two months</h2><p>New episodes for your shows appear here once the networks announce air dates. Times are shown in your phone's time zone (US air time for US shows).</p></div>`;
  return h;
}
function friends(){const seen=new Map();for(const x of [...(S.suggestions||[]),...S.movies,...Object.values(S.shows)])if(x.from){const k=x.from.trim().toLowerCase();if(k&&!seen.has(k))seen.set(k,x.from.trim())}return [...seen.values()].sort((a,b)=>a.localeCompare(b))}

const manualRow=(p,q)=>`<div class="res"><div class="noimg"></div><div class="t"><b>Not listed?</b><small>Add “${esc(q)}” with just the title. Apple's catalogue often misses cinema releases and streaming-service originals.</small></div><button class="btn small" data-act="${p.suggest?'sg-save-manual':'add-movie-manual'}">${p.suggest?'Save':'Add'}</button></div>`;
async function doSearch(){
  const p=V.page;if(!p||p.type!=='add')return;
  const q=(p.q||'').trim(),box=$('#results');if(!box)return;
  if(q.length<2){box.innerHTML='';return}
  box.innerHTML='<p class="note" style="padding:12px 0">Searching…</p>';
  const token=p.token=Math.random();
  try{
    if(p.kind==='tv'){
      const r=await getJSON(`${API}/search/shows?q=${encodeURIComponent(q)}`)||[];
      if(token!==p.token)return;
      p.res=r.map(x=>x.show);
      box.innerHTML=p.res.length?p.res.map(s=>{const have=!!S.shows[s.id];
        return `<div class="res">${s.image?`<img src="${esc(s.image.medium)}" alt="" loading="lazy">`:'<div class="noimg"></div>'}
          <div class="t"><b>${esc(s.name)}</b><small>${esc([s.premiered?s.premiered.slice(0,4):'',(s.network&&s.network.name)||(s.webChannel&&s.webChannel.name)||'',s.status].filter(Boolean).join(' · '))}</small></div>
          ${p.suggest?`<button class="btn small pri" data-act="sg-save" data-ix="${p.res.indexOf(s)}">Save</button>`
          :`<button class="btn small ${have?'':'pri'}" data-act="add-show" data-id="${s.id}"${have?' disabled':''}>${have?'Added':'Add'}</button>`}</div>`}).join('')
        :'<p class="note" style="padding:12px 0">No shows found. Check the spelling, or try fewer words.</p>';
    }else{
      const d=await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=movie&entity=movie&country=au&limit=25`);
      if(token!==p.token)return;
      p.res=(d.results||[]).map(x=>({id:'it'+x.trackId,title:x.trackName,year:x.releaseDate?x.releaseDate.slice(0,4):'',
        image:x.artworkUrl100?x.artworkUrl100.replace(/\d+x\d+bb/,'400x600bb'):'',genre:x.primaryGenreName||'',
        runtime:x.trackTimeMillis?Math.round(x.trackTimeMillis/60000):0,rating:x.contentAdvisoryRating||'',overview:x.longDescription||x.shortDescription||''}));
      const manual=manualRow(p,q);
      box.innerHTML=p.res.map((m,ix)=>{const have=S.movies.some(x=>x.id===m.id);
        return `<div class="res">${m.image?`<img src="${esc(m.image)}" alt="" loading="lazy">`:'<div class="noimg"></div>'}
          <div class="t"><b>${esc(m.title)}</b><small>${esc([m.year,m.genre].filter(Boolean).join(' · '))}</small></div>
          ${p.suggest?`<button class="btn small pri" data-act="sg-save" data-ix="${ix}">Save</button>`
          :`<button class="btn small ${have?'':'pri'}" data-act="add-movie-res" data-ix="${ix}"${have?' disabled':''}>${have?'Added':'Add'}</button>`}</div>`}).join('')+manual;
    }
  }catch(e){if(token===p.token)box.innerHTML=`<p class="note" style="padding:12px 0">Search didn't work. Check you're online, then try again.</p>`+(p.kind==='movie'?manualRow(p,q):'')}
}

function fmtWhen(t){if(!t)return 'Never';const d=new Date(t),today=new Date();
  const tm=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===today.toDateString())return 'Today '+tm;
  if(d.toDateString()===new Date(Date.now()-DAY).toDateString())return 'Yesterday '+tm;
  return fmtDate(t)+' '+tm}

/* ---------- Dropbox: live copy + daily snapshots ----------
   Dropbox › Apps › NextUp
     live/nextup.json          the current shows & movies
     snapshots/nextup-*.json   one per day, plus one before every restore (kept 60 days) */
const DBX_APP_KEY='1nyd2hwfb6ffblz'; // public App key for the NextUp Dropbox app; the App secret is never used
const DBX_TOKEN='https://api.dropboxapi.com/oauth2/token';
const DBX_REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const LIVE='/live/nextup.json';
const dbxOn=()=>!!(M.dbx&&M.dbx.refresh);
let syncing=false,syncT=null,retryT=null,lastCheck=0;
const ownerName=()=>'phone set up '+fmtDate(M.created||Date.now());
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
class DbxErr extends Error{constructor(m,s,sum){super(m);this.status=s;this.summary=sum||''}}
const dbxArg=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
const payload=()=>({app:'nextup',schema:1,appVersion:APP_VERSION,updatedAt:new Date().toISOString(),owner:M.deviceId,ownerName:ownerName(),
  data:{shows:slimShows(),movies:S.movies,suggestions:S.suggestions||[],lastRefresh:S.lastRefresh||0}});
function slimShows(){const o={};for(const [k,sh] of Object.entries(S.shows))o[k]={...sh,episodes:sh.episodes.map(({sm,...e})=>e)};return o}
const hasSyn=sh=>!sh.episodes.length||sh.episodes.some(e=>'sm' in e);
const needsRefresh=()=>Date.now()-(S.lastRefresh||0)>6*36e5||Object.values(S.shows).some(sh=>!hasSyn(sh));
function readPayload(j){const d=j&&(j.data||j);
  if(!d||typeof d.shows!=='object'||!d.shows||!Array.isArray(d.movies))throw new Error("That isn't a Next Up backup");
  return {shows:d.shows,movies:d.movies,suggestions:Array.isArray(d.suggestions)?d.suggestions:[],lastRefresh:d.lastRefresh||0}}
function snapName(kind){const d=new Date();
  return `/snapshots/nextup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}${kind?'-'+pad(d.getHours())+pad(d.getMinutes())+'-'+kind:''}.json`}

function syncText(){
  if(!dbxOn())return hasData()?{t:'Not backed up · tap to set up',c:'warn'}:{t:'Version '+APP_VERSION,c:''};
  if(M.conflict)return {t:'Dropbox copy differs · tap to choose',c:'warn'};
  if(syncing)return {t:'Syncing with Dropbox…',c:''};
  if(M.syncError)return {t:'Dropbox sync failed · tap',c:'warn'};
  if(M.dirty){const n=M.changes||1;return {t:`${n} change${n===1?'':'s'} waiting for Dropbox${mobileBlocked()?' (Wi‑Fi)':''}`,c:''}}
  return {t:'In Dropbox ✓',c:'ok'};
}
function paintStatus(){const el=$('#syncLine');if(!el)return;const s=syncText();el.textContent=s.t;el.className='syncline '+s.c;
  const mv=$('#menuVer');if(mv)mv.textContent='Next Up version '+APP_VERSION}

async function dbxConnect(){
  if(!navigator.onLine){toast("You're offline. Connect Dropbox when you have internet.");return}
  const v=b64url(crypto.getRandomValues(new Uint8Array(48))),state=b64url(crypto.getRandomValues(new Uint8Array(12)));
  const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  M.pkce={v,state};M.syncError=null;await saveMeta();
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:DBX_APP_KEY,response_type:'code',
    code_challenge:challenge,code_challenge_method:'S256',redirect_uri:DBX_REDIRECT,token_access_type:'offline',state});
}
async function dbxReturn(){
  const p=new URLSearchParams(location.search);
  if(!p.has('code')&&!p.has('error'))return false;
  history.replaceState(null,'',DBX_REDIRECT);
  if(p.has('error')){toast('Dropbox not connected: '+(p.get('error_description')||p.get('error')).replace(/\+/g,' '));return true}
  if(!M.pkce||p.get('state')!==M.pkce.state){toast("That Dropbox sign-in didn't match. Tap Connect Dropbox again.");return true}
  try{
    const r=await fetch(DBX_TOKEN,{method:'POST',body:new URLSearchParams({grant_type:'authorization_code',code:p.get('code'),
      client_id:DBX_APP_KEY,code_verifier:M.pkce.v,redirect_uri:DBX_REDIRECT})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.refresh_token)throw new Error(j.error_description||j.error||'HTTP '+r.status);
    M.dbx={refresh:j.refresh_token,access:j.access_token,expires:Date.now()+(j.expires_in||14400)*1000};
    M.pkce=null;M.dbxRev=null;M.syncError=null;M.conflict=null;await saveMeta();
    toast(matchMedia('(display-mode: standalone)').matches?'Dropbox connected':'Dropbox connected. You can close this tab and open Next Up from your home screen.');
  }catch(e){M.pkce=null;M.syncError='Dropbox sign-in failed: '+(e.message||e);await saveMeta();toast(M.syncError)}
  return true;
}
async function dbxToken(){
  const d=M.dbx;if(!d||!d.refresh)throw new Error('Dropbox is not connected');
  if(d.access&&d.expires>Date.now()+60000)return d.access;
  const r=await fetch(DBX_TOKEN,{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:d.refresh,client_id:DBX_APP_KEY})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(j.error==='invalid_grant'){M.dbx=null;M.syncError='Dropbox access was removed or has expired. Connect Dropbox again.';await saveMeta()}
    throw new Error(j.error_description||j.error||'HTTP '+r.status)}
  d.access=j.access_token;d.expires=Date.now()+(j.expires_in||14400)*1000;await saveMeta();return d.access;
}
async function dbxCall(url,opt={},retry=true){
  const tok=await dbxToken();
  const r=await fetch(url,{method:'POST',...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401&&retry){M.dbx.access=null;return dbxCall(url,opt,false)}
  if(r.status===429&&retry){await sleep(3000);return dbxCall(url,opt,false)}
  if(!r.ok){const t=await r.text().catch(()=>'');let s=t;try{s=JSON.parse(t).error_summary||t}catch(e){}
    throw new DbxErr('Dropbox '+r.status+': '+String(s).slice(0,120),r.status,String(s))}
  return r;
}
async function dbxApi(ep,arg){const r=await dbxCall('https://api.dropboxapi.com/2/'+ep,arg===undefined?{}:{headers:{'Content-Type':'application/json'},body:JSON.stringify(arg)});
  const t=await r.text();return t?JSON.parse(t):null}
async function dbxMeta(path){try{return await dbxApi('files/get_metadata',{path})}catch(e){if(e.status===409&&/not_found/.test(e.summary))return null;throw e}}
async function dbxUpload(path,obj,mode){const r=await dbxCall('https://content.dropboxapi.com/2/files/upload',{headers:{'Content-Type':'application/octet-stream',
  'Dropbox-API-Arg':dbxArg({path,mode:mode||'overwrite',autorename:false,mute:true})},body:JSON.stringify(obj)});return r.json()}
async function dbxDownload(path){const r=await dbxCall('https://content.dropboxapi.com/2/files/download',{headers:{'Dropbox-API-Arg':dbxArg({path})}});return JSON.parse(await r.text())}
async function dbxList(path){try{let j=await dbxApi('files/list_folder',{path}),out=j.entries;
  while(j.has_more){j=await dbxApi('files/list_folder/continue',{cursor:j.cursor});out=out.concat(j.entries)}return out}
  catch(e){if(e.status===409&&/not_found/.test(e.summary))return [];throw e}}

const mobileBlocked=()=>!!(M.wifiOnly&&navigator.connection&&navigator.connection.type==='cellular');
function scheduleSync(ms=4000){clearTimeout(syncT);if(dbxOn())syncT=setTimeout(()=>dbxSync(),ms)}
/* What to do, given Dropbox's copy and this phone's. Returns 'adopt' | 'conflict' | 'push' | 'add' | 'none'. */
function syncPlan(remoteRev,localRev,dirty,localHasData){
  if(remoteRev&&remoteRev!==localRev){
    if(!localHasData||(localRev&&!dirty))return 'adopt';   // phone empty, or phone was in step and Dropbox moved on
    return 'conflict';                                      // both changed (or first connect with data on both)
  }
  if(!remoteRev)return localHasData?'add':'none';
  return dirty?'push':'none';
}
async function pushLive(mode){
  const seq=M.seq;
  const res=await dbxUpload(LIVE,payload(),mode||(M.dbxRev?{'.tag':'update',update:M.dbxRev}:'add'));
  M.dbxRev=res.rev;M.lastSync=Date.now();M.syncError=null;M.conflict=null;
  if(M.seq===seq){M.dirty=false;M.changes=0}
  await saveMeta();
}
async function adoptRemote(){
  const rm=await dbxMeta(LIVE);if(!rm)return;
  S=readPayload(await dbxDownload(LIVE));await kvPut('data',S);
  M.dbxRev=rm.rev;M.dirty=false;M.changes=0;M.conflict=null;M.lastSync=Date.now();M.syncError=null;await saveMeta();
  render();if(V.page)renderPage();
  if(needsRefresh())setTimeout(()=>refreshAll(false),500);
}
async function dbxSync(opts={}){
  if(!dbxOn()||syncing)return;
  if(!navigator.onLine){if(opts.manual)toast("You're offline. Changes will go to Dropbox when you're back online.");paintStatus();return}
  if(mobileBlocked()&&!opts.manual){paintStatus();return}
  syncing=true;lastCheck=Date.now();paintStatus();let ok=false,failed=false;
  try{
    const rm=await dbxMeta(LIVE);
    const plan=syncPlan(rm&&rm.rev,M.dbxRev,!!M.dirty,hasData());
    if(plan==='adopt'){const had=hasData();await adoptRemote();toast(had?'Loaded the latest from Dropbox':`${Object.keys(S.shows).length} shows and ${S.movies.length} movies loaded from Dropbox`)}
    else if(plan==='conflict'){M.conflict={rev:rm.rev,when:rm.server_modified};await saveMeta()}
    else if(plan==='push')await pushLive();
    else if(plan==='add')await pushLive('add');
    if(plan!=='conflict'){ok=true;if(plan==='none'){M.lastSync=Date.now();M.syncError=null;await saveMeta()}}
  }catch(e){
    if(e instanceof DbxErr&&e.status===409&&/conflict/.test(e.summary)){
      const rm=await dbxMeta(LIVE).catch(()=>null);M.conflict={rev:rm&&rm.rev,when:rm&&rm.server_modified};
    }else{failed=true;M.syncError=(!navigator.onLine||e instanceof TypeError)?"Couldn't reach Dropbox. It will try again shortly.":String(e.message||e)}
    await saveMeta();if(opts.manual&&M.syncError)toast(M.syncError);
  }finally{syncing=false}
  if(ok&&opts.manual)toast('Dropbox is up to date');
  if(ok&&hasData())maybeSnapshot(false).catch(()=>{});
  paintStatus();if(V.page&&V.page.type==='backup')renderPage();
  clearTimeout(retryT);if(failed&&dbxOn())retryT=setTimeout(()=>dbxSync(),120000);
  if(ok&&M.dirty)scheduleSync(1500); // changes made while it was uploading
}
async function maybeSnapshot(force){
  const day=new Date().toDateString();
  if(!force&&M.lastSnapDay===day)return;
  await dbxUpload(snapName(force?'manual':''),payload(),'overwrite');
  M.lastSnapDay=day;M.lastSnap=Date.now();await saveMeta();
  if(V.page&&V.page.type==='backup')renderPage();
  pruneSnapshots().catch(()=>{});
}
async function pruneSnapshots(){
  const cut=Date.now()-60*DAY;
  for(const e of await dbxList('/snapshots')){const m=e.name.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(e['.tag']==='file'&&m&&new Date(+m[1],m[2]-1,+m[3]).getTime()<cut){try{await dbxApi('files/delete_v2',{path:e.path_lower})}catch(x){}}}
}
async function listSnapshots(){
  const el=$('#snapList');if(!el)return;el.innerHTML='<p class="note">Looking in Dropbox…</p>';
  try{const list=(await dbxList('/snapshots')).filter(e=>e['.tag']==='file'&&/\.json$/i.test(e.name)).sort((a,b)=>String(b.server_modified).localeCompare(String(a.server_modified)));
    el.innerHTML=list.length?list.slice(0,60).map(e=>`<div class="snap"><div class="t"><b>${esc(fmtWhen(e.server_modified))}</b>
      <small>${/before-restore/.test(e.name)?'Saved before a restore · ':/replaced/.test(e.name)?'Dropbox copy that was replaced · ':/manual/.test(e.name)?'Snapshot now · ':'Daily · '}${(e.size/1024).toFixed(0)} KB</small></div>
      <button class="btn small" data-act="dbx-use" data-path="${esc(e.path_lower)}">Use this</button></div>`).join('')
      :'<p class="note">No snapshots in Dropbox yet.</p>';
  }catch(e){el.innerHTML=`<p class="note" style="color:var(--bad)">Couldn't list Dropbox snapshots: ${esc(e.message||e)}</p>`}
}
async function replaceAllWith(newData,label){
  if(dbxOn()&&hasData()){try{await dbxUpload(snapName('before-restore'),payload(),'overwrite')}
    catch(e){toast("Couldn't save a snapshot to Dropbox first, so nothing was changed. Check you're online.");return false}}
  S=newData;await kvPut('data',S);M.conflict=null;save();render();if(V.page)renderPage();
  toast(`${label}: ${Object.keys(S.shows).length} shows and ${S.movies.length} movies`);
  if(dbxOn())dbxSync();
  if(needsRefresh())setTimeout(()=>refreshAll(false),500);
  return true;
}
async function resolveConflict(useDropbox){
  if(!navigator.onLine){toast("You're offline. Try again when you're online.");return}
  syncing=true;paintStatus();
  try{
    if(useDropbox){if(hasData())await dbxUpload(snapName('before-restore'),payload(),'overwrite');
      syncing=false;await adoptRemote();toast('Using the Dropbox copy. This phone\'s copy was saved as a snapshot.')}
    else{try{await dbxApi('files/copy_v2',{from_path:LIVE,to_path:snapName('replaced'),autorename:true})}catch(e){}
      await pushLive('overwrite');toast('Kept this phone\'s copy. The Dropbox copy was saved as a snapshot.')}
  }catch(e){toast('That didn\'t work: '+(e.message||e))}
  syncing=false;paintStatus();if(V.page)renderPage();
}
async function dbxDisconnect(){
  try{await dbxApi('auth/token/revoke')}catch(e){}
  M.dbx=null;M.dbxRev=null;M.conflict=null;M.syncError=null;await saveMeta();
  clearTimeout(syncT);paintStatus();if(V.page)renderPage();toast('Dropbox disconnected. Everything already in Dropbox is kept.');
}

/* ---------- actions ---------- */
async function addShowById(id,btn){
  if(S.shows[id])return S.shows[id];
  if(btn){btn.disabled=true;btn.textContent='Adding…'}
  try{const j=await fetchShow(id);S.shows[id]=fromApi(j);save();
    if(btn){btn.textContent='Added';btn.classList.remove('pri')}toast(`Added ${j.name}`);return S.shows[id];}
  catch(e){if(btn){btn.disabled=false;btn.textContent='Add'}toast("Couldn't add that show. Check you're online.");return null}
}
async function refreshAll(force){
  if(V.refreshing)return;const list=Object.values(S.shows);if(!list.length)return;
  if(!navigator.onLine){if(force)toast("You're offline. Showing saved episode lists.");return}
  V.refreshing=true;render();let ok=0,fail=0;
  for(const sh of list){
    if(!force&&sh.status==='Ended'&&Date.now()-sh.updated<7*DAY&&hasSyn(sh))continue;
    try{const j=await fetchShow(sh.id);if(j){S.shows[sh.id]=fromApi(j,S.shows[sh.id]||sh);ok++}}catch(e){fail++}
    await sleep(350);
  }
  S.lastRefresh=Date.now();save();V.refreshing=false;render();if(V.page&&V.page.type==='show')renderPage();
  if(force)toast(fail?`Updated ${ok} shows, ${fail} failed`:`Updated ${ok} shows`);
}
async function bulkAdd(){
  const ta=$('#bulkText'),log=$('#bulkLog'),go=$('#bulkGo');V.page.text=ta.value;
  const lines=ta.value.split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return;
  go.disabled=true;go.textContent='Adding…';log.innerHTML='';
  for(const line of lines){
    let [name,spec]=line.split('|').map(x=>(x||'').trim());let year=null;
    const ym=name.match(/\((\d{4})\)\s*$/);if(ym){year=ym[1];name=name.replace(ym[0],'').trim()}
    const row=document.createElement('div');row.textContent='… '+name;log.appendChild(row);
    try{
      let found=null;
      if(year){const r=await getJSON(`${API}/search/shows?q=${encodeURIComponent(name)}`)||[];found=(r.find(x=>(x.show.premiered||'').startsWith(year))||r[0]||{}).show}
      else found=await getJSON(`${API}/singlesearch/shows?q=${encodeURIComponent(name)}`);
      if(!found){row.className='bad';row.textContent=`✗ ${name}: not found. Try a different spelling.`;continue}
      let sh=S.shows[found.id];const existed=!!sh;
      if(!sh){await sleep(300);sh=fromApi(await fetchShow(found.id));S.shows[sh.id]=sh}
      const okSpec=spec?setProgress(sh,spec):true;save();
      const i=info(sh);
      row.className=okSpec?'ok':'bad';
      row.textContent=`✓ ${sh.name} (${(sh.premiered||'').slice(0,4)})${existed?' already added':''}: `+(i.next?`next is ${code(i.next)}`:'all caught up')+(okSpec?'':` · couldn't read "${spec}", set progress on the show page`);
    }catch(e){row.className='bad';row.textContent=`✗ ${name}: couldn't reach TVmaze. Check you're online and tap Add again.`}
    await sleep(500);
  }
  go.disabled=false;go.textContent='Add these shows';render();
  const done=document.createElement('p');done.className='note';done.style.marginTop='10px';
  done.innerHTML='Done. If a show matched the wrong series, open it, tap Remove, then add the right one with the year in brackets.';log.appendChild(done);
}
function backup(){
  const blob=new Blob([JSON.stringify(payload())],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`nextup-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Backup saved to Downloads');
}
$('#restoreFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';closeMenu();if(!f)return;
  let d;try{d=readPayload(JSON.parse(await f.text()))}catch(x){toast("That file isn't a Next Up backup");return}

let toastT;

function openMenu(){$('#menu').hidden=false;$('#scrim').hidden=false}

document.addEventListener('click',e=>{

    case 'expand':el.classList.toggle('open');break;
    case 'ep-syn':{p.syn=p.syn||new Set();const id=+el.dataset.ep;p.syn.has(id)?p.syn.delete(id):p.syn.add(id);
      const y=$('#page').scrollTop;renderPage();$('#page').scrollTop=y;break}
    case 'sg-save':case 'sg-save-manual':{

      let item;
      if(act==='sg-save-manual'){const t=(p.q||'').trim();if(!t)break;item={kind:'movie',title:t,year:'',image:'',summary:'',movie:{id:'m'+Date.now(),title:t,year:'',image:'',genre:'',runtime:0,rating:'',overview:''}}}
      else if(p.kind==='tv'){const s=p.res[+el.dataset.ix];item={kind:'tv',tvId:s.id,title:s.name,year:s.premiered?s.premiered.slice(0,4):'',image:s.image?s.image.medium:'',summary:strip(s.summary)}}
      else{const m=p.res[+el.dataset.ix];item={kind:'movie',title:m.title,year:m.year,image:m.image,summary:m.overview,movie:m}}
      S.suggestions.push({id:'sg'+Date.now(),from,note,added:Date.now(),...item});save();
      el.disabled=true;el.textContent='Saved';el.classList.remove('pri');toast(`Saved ${item.title} from ${from}`);break}
    case 'sg-accept':{const x=S.suggestions.find(s=>s.id===el.dataset.id);if(!x)break;
      if(x.kind==='tv'){addShowById(x.tvId,el).then(sh=>{if(!sh)return;sh.from=x.from;sh.fromNote=x.note;
        S.suggestions=S.suggestions.filter(s=>s.id!==x.id);save();render();toast(`${x.title} added to your Shows`)})}
      else{if(!S.movies.some(m=>m.id===x.movie.id))S.movies.push({...x.movie,watched:false,added:Date.now(),from:x.from,note:x.note});
        S.suggestions=S.suggestions.filter(s=>s.id!==x.id);save();render();toast(`${x.title} added to your movie watchlist`)}
      break}
    case 'sg-remove':armRemove(el,()=>{const x=S.suggestions.find(s=>s.id===el.dataset.id);S.suggestions=S.suggestions.filter(s=>s.id!==el.dataset.id);save();render();
      if(x)toast(`Removed ${x.title}`,()=>{S.suggestions.push(x);save();render()})},'Tap again');break;
    case 'add-movie':openPage({type:'add',kind:'movie'});break;
    case 'back':closePage();break;
    case 'open-show':{const sh=S.shows[+el.dataset.id];openPage({type:'show',id:+el.dataset.id,ptab:V.ptab||'overview'});if(sh)fetchBanner(sh);break}
    case 'open-movie':openPage({type:'movie',id:el.dataset.id});break;
    case 'quick':{e.stopPropagation();const sh=S.shows[el.dataset.id],n=info(sh).next;if(!n)break;
      sh.watched.push(n.id);sh.lastWatched=Date.now();save();render();
      toast(`${sh.name} ${code(n)} watched`,()=>{sh.watched=sh.watched.filter(x=>x!==n.id);save();render()});break}
    case 'ep':{const sh=S.shows[p.id],id=+el.dataset.ep;
      if(sh.watched.includes(id))sh.watched=sh.watched.filter(x=>x!==id);else{sh.watched.push(id);sh.lastWatched=Date.now()}
      save();renderPage();break}
    case 'season':{const sh=S.shows[p.id],s=+el.dataset.s,on=el.dataset.on==='1';
      const ids=sh.episodes.filter(x=>x.s===s&&(aired(x)||!on)).map(x=>x.id);
      sh.watched=sh.watched.filter(x=>!ids.includes(x));if(on){sh.watched.push(...ids);sh.lastWatched=Date.now()}
      p.open.add(s);save();renderPage();break}
    case 'set-progress':{const sh=S.shows[p.id];setProgress(sh,$('#progSel').value);save();renderPage();toast('Progress updated');break}
    case 'refresh-one':{const sh=S.shows[p.id];el.disabled=true;el.textContent='Refreshing…';
      fetchShow(sh.id).then(j=>{S.shows[sh.id]=fromApi(j,sh);save();renderPage();toast('Episode list updated')})
        .catch(()=>{el.disabled=false;el.textContent='Refresh episodes';toast("Couldn't refresh. Check you're online.")});break}
    case 'remove-show':armRemove(el,()=>{const n=S.shows[p.id].name;delete S.shows[p.id];save();closePage();toast(`Removed ${n}`)});break;
    case 'add-kind':p.kind=el.dataset.k;p.res=null;renderAdd();break;
    case 'add-show':addShowById(+el.dataset.id,el);break;
    case 'add-movie-res':{const m=p.res[+el.dataset.ix];if(S.movies.some(x=>x.id===m.id))break;
      S.movies.push({...m,watched:false,added:Date.now()});save();el.disabled=true;el.textContent='Added';el.classList.remove('pri');toast(`${m.title} added to your watchlist`);break}
    case 'add-movie-manual':{const t=(p.q||'').trim();if(!t)break;
      S.movies.push({id:'m'+Date.now(),title:t,year:'',image:'',genre:'',runtime:0,rating:'',overview:'',watched:false,added:Date.now()});
      save();el.disabled=true;el.textContent='Added';toast(`${t} added`);break}
    case 'movie-toggle':{const m=S.movies.find(x=>x.id===p.id);m.watched=!m.watched;m.watchedAt=m.watched?Date.now():null;save();renderPage();
      toast(m.watched?'Moved to Watched':'Back on your watchlist');break}
    case 'remove-movie':armRemove(el,()=>{S.movies=S.movies.filter(x=>x.id!==p.id);save();closePage()});break;
    case 'bulk-go':bulkAdd();break;
    case 'ptab':p.ptab=V.ptab=el.dataset.t;renderPage();break;
    case 'more':p.more=!p.more;el.classList.toggle('open',p.more);break;
    case 'mark-next':{const sh=S.shows[p.id],n=info(sh).next;if(!n)break;sh.watched.push(n.id);sh.lastWatched=Date.now();save();renderPage();
      toast(`${code(n)} watched`,()=>{sh.watched=sh.watched.filter(x=>x!==n.id);save();renderPage()});break}
  }
});
let lpT=null,lpFired=false;
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.eye');if(!b||b.disabled)return;lpFired=false;
  lpT=setTimeout(()=>{lpFired=true;const sh=S.shows[V.page.id],ep=sh.episodes.find(x=>x.id===+b.dataset.ep);if(!ep)return;
    const before=sh.watched.slice();setProgress(sh,code(ep));save();renderPage();if(navigator.vibrate)navigator.vibrate(30);
    toast(`Watched everything up to ${code(ep)}`,()=>{sh.watched=before;save();renderPage()})},550);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lpT)));
document.addEventListener('click',e=>{if(lpFired&&e.target.closest('.eye')){e.stopImmediatePropagation();e.preventDefault();lpFired=false}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.eye'))e.preventDefault()});
document.addEventListener('toggle',e=>{
  if(e.target.matches&&e.target.matches('details.season')&&V.page&&V.page.open){
    const s=+e.target.dataset.s;e.target.open?V.page.open.add(s):V.page.open.delete(s);}
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[role=button]'))e.target.click();
  if(e.key==='Enter'&&e.target.id==='sgFrom'){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'){if(!$('#menu').hidden||!$('#sortMenu').hidden)closeMenu();else closePage()}
});

document.addEventListener('change',e=>{if(e.target.id==='wifiOnly'){M.wifiOnly=e.target.checked;saveMeta();paintStatus();if(!M.wifiOnly)dbxSync()}});
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){if(M.dirty)dbxSync();return}
  const m=await kvGet('meta');                       // another window (e.g. the Dropbox sign-in tab) may have saved newer data
  if(m&&(m.stamp||0)>(M.stamp||0)){M=m;S=await kvGet('data')||emptyData();render();if(V.page)renderPage()}
  if(Date.now()-lastCheck>60000)dbxSync();
});
window.addEventListener('online',()=>dbxSync());
(async()=>{
  await loadAll();render();
  await dbxReturn();
  await dbxSync();
  if(needsRefresh())refreshAll(false);
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
